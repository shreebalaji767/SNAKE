<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID SNAKE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07100c;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at center,
            #123329 0%,
            #07100c 55%,
            #030705 100%
        );
}

.menuBox{
    width:min(440px,94vw);
    padding:32px 24px 24px;
    border:1px solid #1b604b;
    border-radius:20px;
    background:#08140f;
    box-shadow:
        0 25px 70px #000,
        0 0 30px rgba(0,255,180,.06);
    text-align:center;
}

.logo{
    font-size:clamp(38px,11vw,68px);
    line-height:.9;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
}

.logo span{
    color:#00ffb3;
}

.logoSub{
    margin-top:12px;
    color:#62bca0;
    font-size:13px;
    font-weight:bold;
    letter-spacing:5px;
}

.description{
    margin:20px 0;
    color:#779087;
    font-size:12px;
}

.menuButtons{
    display:grid;
    gap:10px;
}

.menuBtn{
    width:100%;
    min-height:54px;
    border-radius:10px;
    border:1px solid #205d49;
    background:#0d2119;
    color:#dffff4;
    font-size:14px;
    font-weight:bold;
    letter-spacing:2px;
}

.menuBtn:active{
    transform:scale(.97);
}

.menuBtn.primary{
    background:#00e6a2;
    border-color:#00e6a2;
    color:#00150e;
}

.menuBtn.danger{
    color:#ffaaaa;
}

.controlsInfo{
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    background:#0b1b15;
    color:#6f8980;
    font-size:11px;
    line-height:1.7;
}

.controlsInfo b{
    color:#b9eee0;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    background:#07100c;
}

#topbar{
    height:64px;
    flex:0 0 64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 12px;
    background:#050b08;
    border-bottom:1px solid #15382c;
}

.title{
    color:#00ffb3;
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
}

.stats{
    display:flex;
    gap:6px;
}

.stat{
    min-width:62px;
    padding:5px 7px;
    text-align:center;
    background:#0b1913;
    border:1px solid #153d2e;
    border-radius:7px;
}

.statLabel{
    color:#5f776e;
    font-size:7px;
    font-weight:bold;
}

.statValue{
    margin-top:2px;
    color:#e4fff7;
    font-size:14px;
    font-weight:bold;
}

#pause{
    width:42px;
    height:42px;
    border-radius:8px;
    background:#0d2119;
    border:1px solid #205d49;
    color:#dffff4;
    font-size:17px;
}

#boardArea{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
}

#board{
    display:block;
    width:min(
        calc(100vw - 16px),
        calc(100vh - 90px),
        720px
    );
    height:min(
        calc(100vw - 16px),
        calc(100vh - 90px),
        720px
    );
    max-width:100%;
    max-height:100%;
    background:#08130e;
    border:2px solid #1b604b;
    border-radius:8px;
    box-shadow:
        0 0 25px rgba(0,255,180,.08),
        0 15px 50px #000;
}

/* =========================
   OVERLAYS
========================= */

.overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:20;
}

.overlayBox{
    width:min(350px,90vw);
    padding:28px 20px;
    text-align:center;
    background:#09150f;
    border:1px solid #1d634c;
    border-radius:16px;
    box-shadow:0 25px 70px #000;
}

.overlayTitle{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

.overlayText{
    margin:12px 0 20px;
    color:#82978f;
    font-size:13px;
    line-height:1.7;
}

.overlayText b{
    color:#00ffb3;
}

.overlayButtons{
    display:grid;
    gap:9px;
}

/* =========================
   TOUCH CONTROLS
========================= */

#touch{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    display:none;
    justify-content:space-between;
    align-items:flex-end;
    padding:15px;
    pointer-events:none;
    z-index:15;
}

.dpad{
    width:145px;
    height:145px;
    position:relative;
    pointer-events:auto;
}

.dpad button{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:9px;
    background:#0b2018;
    border:1px solid #21604b;
    color:#dffff4;
    font-size:20px;
}

.dpad button:active{
    background:#00a879;
}

#up{
    left:48px;
    top:0;
}

#down{
    left:48px;
    bottom:0;
}

#left{
    left:0;
    top:48px;
}

#right{
    right:0;
    top:48px;
}

.touchRight{
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.touchAction{
    width:62px;
    height:62px;
    border-radius:12px;
    background:#0b2018;
    border:1px solid #21604b;
    color:#dffff4;
    font-size:9px;
    font-weight:bold;
}

.touchAction:active{
    background:#00a879;
}

@media(pointer:coarse){
    #touch{
        display:flex;
    }
}

@media(max-width:600px){

    #topbar{
        height:58px;
        flex-basis:58px;
        padding:6px 7px;
    }

    .title{
        font-size:13px;
    }

    .stat{
        min-width:52px;
    }

    .statValue{
        font-size:12px;
    }

    #pause{
        width:38px;
        height:38px;
    }

    #board{
        width:min(
            calc(100vw - 10px),
            calc(100vh - 78px)
        );
        height:min(
            calc(100vw - 10px),
            calc(100vh - 78px)
        );
    }
}
</style>
</head>

<body>

<!-- =========================
     MAIN MENU
========================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            VOID<span>SNAKE</span>
        </div>

        <div class="logoSub">
            CLASSIC
        </div>

        <div class="description">
            A simple classic Snake game.
        </div>

        <div class="menuButtons">

            <button
                id="play"
                class="menuBtn primary">
                PLAY
            </button>

            <button
                id="menuPause"
                class="menuBtn">
                PAUSE / RESUME
            </button>

            <button
                id="menuExit"
                class="menuBtn danger">
                EXIT
            </button>

        </div>

        <div class="controlsInfo">

            <b>KEYBOARD</b><br>
            W / ↑ = UP &nbsp;&nbsp;
            S / ↓ = DOWN<br>
            A / ← = LEFT &nbsp;&nbsp;
            D / → = RIGHT<br>
            SPACE = PAUSE

            <br><br>

            <b>TOUCHSCREEN</b><br>
            Use the directional buttons.

        </div>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <div id="topbar">

        <div class="title">
            VOID SNAKE
        </div>

        <div class="stats">

            <div class="stat">
                <div class="statLabel">
                    SCORE
                </div>
                <div
                    id="score"
                    class="statValue">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="statLabel">
                    LENGTH
                </div>
                <div
                    id="length"
                    class="statValue">
                    5
                </div>
            </div>

            <div class="stat">
                <div class="statLabel">
                    LEVEL
                </div>
                <div
                    id="level"
                    class="statValue">
                    1
                </div>
            </div>

        </div>

        <button id="pause">
            Ⅱ
        </button>

    </div>


    <div id="boardArea">

        <canvas id="board"></canvas>

    </div>


    <!-- PAUSE -->

    <div
        id="pauseOverlay"
        class="overlay">

        <div class="overlayBox">

            <div class="overlayTitle">
                PAUSED
            </div>

            <div class="overlayText">
                Game paused.
            </div>

            <div class="overlayButtons">

                <button
                    id="resume"
                    class="menuBtn primary">
                    RESUME
                </button>

                <button
                    id="pauseRestart"
                    class="menuBtn">
                    RESTART
                </button>

                <button
                    id="pauseMenu"
                    class="menuBtn danger">
                    MAIN MENU
                </button>

            </div>

        </div>

    </div>


    <!-- GAME OVER -->

    <div
        id="gameOverOverlay"
        class="overlay">

        <div class="overlayBox">

            <div class="overlayTitle">
                GAME OVER
            </div>

            <div class="overlayText">

                SCORE:
                <b id="finalScore">0</b>

                <br>

                LENGTH:
                <b id="finalLength">5</b>

                <br>

                LEVEL:
                <b id="finalLevel">1</b>

            </div>

            <div class="overlayButtons">

                <button
                    id="restart"
                    class="menuBtn primary">
                    RESTART
                </button>

                <button
                    id="gameMenu"
                    class="menuBtn">
                    MAIN MENU
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     TOUCH CONTROLS
========================= -->

<div id="touch">

    <div class="dpad">

        <button id="up">
            ▲
        </button>

        <button id="left">
            ◀
        </button>

        <button id="right">
            ▶
        </button>

        <button id="down">
            ▼
        </button>

    </div>

    <div class="touchRight">

        <button
            id="touchPause"
            class="touchAction">
            PAUSE
        </button>

        <button
            id="touchRestart"
            class="touchAction">
            RESTART
        </button>

        <button
            id="touchExit"
            class="touchAction">
            EXIT
        </button>

    </div>

</div>


<script>
"use strict";

/* =========================================================
   CLASSIC SNAKE ENGINE
========================================================= */

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const board =
    document.getElementById("board");

const ctx =
    board.getContext("2d");

const play =
    document.getElementById("play");

const menuPause =
    document.getElementById("menuPause");

const menuExit =
    document.getElementById("menuExit");

const pause =
    document.getElementById("pause");

const pauseOverlay =
    document.getElementById("pauseOverlay");

const resume =
    document.getElementById("resume");

const pauseRestart =
    document.getElementById("pauseRestart");

const pauseMenu =
    document.getElementById("pauseMenu");

const gameOverOverlay =
    document.getElementById("gameOverOverlay");

const restart =
    document.getElementById("restart");

const gameMenu =
    document.getElementById("gameMenu");

const scoreText =
    document.getElementById("score");

const lengthText =
    document.getElementById("length");

const levelText =
    document.getElementById("level");

const finalScore =
    document.getElementById("finalScore");

const finalLength =
    document.getElementById("finalLength");

const finalLevel =
    document.getElementById("finalLevel");


/* =========================================================
   GAME SETTINGS
========================================================= */

const GRID = 25;

const START_LENGTH = 5;

const INITIAL_SPEED = 150;

const FASTEST_SPEED = 60;


/* =========================================================
   GAME VARIABLES
========================================================= */

let snake = [];

let food = {
    x: 0,
    y: 0
};

let currentDirection = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let score = 0;

let level = 1;

let speed = INITIAL_SPEED;

let timer = null;

let running = false;

let paused = false;

let ended = false;

let boardSize = 0;

let cell = 0;


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeBoard(){

    const rect =
        board.getBoundingClientRect();

    const size =
        Math.floor(
            Math.min(
                rect.width,
                rect.height
            )
        );

    if(size <= 0){
        return;
    }

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    board.width =
        size * dpr;

    board.height =
        size * dpr;

    boardSize = size;

    cell =
        boardSize / GRID;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}

window.addEventListener(
    "resize",
    resizeBoard
);


/* =========================================================
   CREATE SNAKE
========================================================= */

function createSnake(){

    snake = [];

    const x =
        Math.floor(GRID / 2);

    const y =
        Math.floor(GRID / 2);

    for(
        let i = 0;
        i < START_LENGTH;
        i++
    ){

        snake.push({
            x: x - i,
            y: y
        });

    }
}


/* =========================================================
   CREATE FOOD
========================================================= */

function createFood(){

    let found = false;

    while(!found){

        const x =
            Math.floor(
                Math.random() * GRID
            );

        const y =
            Math.floor(
                Math.random() * GRID
            );

        found = true;

        for(const part of snake){

            if(
                part.x === x &&
                part.y === y
            ){

                found = false;
                break;
            }
        }

        if(found){

            food.x = x;
            food.y = y;
        }
    }
}


/* =========================================================
   START
========================================================= */

function startGame(){

    stopTimer();

    createSnake();

    currentDirection = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    level = 1;

    speed = INITIAL_SPEED;

    running = true;

    paused = false;

    ended = false;

    menu.style.display = "none";

    game.style.display = "flex";

    pauseOverlay.style.display = "none";

    gameOverOverlay.style.display = "none";

    createFood();

    updateStats();

    requestAnimationFrame(
        resizeBoard
    );

    startTimer();
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    stopTimer();

    if(
        !running ||
        paused ||
        ended
    ){
        return;
    }

    timer =
        setInterval(
            moveSnake,
            speed
        );
}


function stopTimer(){

    if(timer !== null){

        clearInterval(timer);

        timer = null;
    }
}


/* =========================================================
   MOVE
========================================================= */

function moveSnake(){

    if(
        !running ||
        paused ||
        ended
    ){
        return;
    }

    currentDirection = {
        x: nextDirection.x,
        y: nextDirection.y
    };

    const head =
        snake[0];

    const newHead = {
        x:
            head.x +
            currentDirection.x,

        y:
            head.y +
            currentDirection.y
    };


    /* WALL */

    if(
        newHead.x < 0 ||
        newHead.x >= GRID ||
        newHead.y < 0 ||
        newHead.y >= GRID
    ){

        gameOver();

        return;
    }


    /* SELF */

    for(
        let i = 0;
        i < snake.length;
        i++
    ){

        if(
            newHead.x === snake[i].x &&
            newHead.y === snake[i].y
        ){

            gameOver();

            return;
        }
    }


    snake.unshift(newHead);


    /* FOOD */

    if(
        newHead.x === food.x &&
        newHead.y === food.y
    ){

        score += 10;

        level =
            Math.floor(
                score / 50
            ) + 1;

        speed =
            Math.max(
                FASTEST_SPEED,
                INITIAL_SPEED -
                ((level - 1) * 12)
            );

        createFood();

        updateStats();

        startTimer();

    }else{

        snake.pop();
    }

    draw();
}


/* =========================================================
   DIRECTION
========================================================= */

function changeDirection(x,y){

    if(
        !running ||
        paused ||
        ended
    ){
        return;
    }


    /* Do not allow instant reverse */

    if(
        x === -currentDirection.x &&
        y === -currentDirection.y
    ){
        return;
    }


    nextDirection = {
        x:x,
        y:y
    };
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(
        !running ||
        ended
    ){
        return;
    }

    paused = true;

    stopTimer();

    pauseOverlay.style.display =
        "flex";
}


function resumeGame(){

    if(
        !running ||
        ended
    ){
        return;
    }

    paused = false;

    pauseOverlay.style.display =
        "none";

    startTimer();

    draw();
}


function togglePause(){

    if(paused){

        resumeGame();

    }else{

        pauseGame();
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    stopTimer();

    running = false;

    paused = false;

    ended = true;

    finalScore.textContent =
        score;

    finalLength.textContent =
        snake.length;

    finalLevel.textContent =
        level;

    gameOverOverlay.style.display =
        "flex";

    draw();
}


/* =========================================================
   MAIN MENU
========================================================= */

function showMenu(){

    stopTimer();

    running = false;

    paused = false;

    ended = false;

    game.style.display =
        "none";

    menu.style.display =
        "flex";

    pauseOverlay.style.display =
        "none";

    gameOverOverlay.style.display =
        "none";
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    scoreText.textContent =
        score;

    lengthText.textContent =
        snake.length;

    levelText.textContent =
        level;
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle =
        "#08130e";

    ctx.fillRect(
        0,
        0,
        boardSize,
        boardSize
    );


    /* subtle checkerboard */

    for(
        let y = 0;
        y < GRID;
        y++
    ){

        for(
            let x = 0;
            x < GRID;
            x++
        ){

            if(
                (x + y) % 2 === 0
            ){

                ctx.fillStyle =
                    "rgba(255,255,255,.012)";

                ctx.fillRect(
                    x * cell,
                    y * cell,
                    cell,
                    cell
                );
            }
        }
    }
}


/* =========================================================
   GRID
========================================================= */

function drawGrid(){

    ctx.strokeStyle =
        "rgba(0,255,180,.045)";

    ctx.lineWidth = 1;

    for(
        let i = 0;
        i <= GRID;
        i++
    ){

        const p =
            i * cell;

        ctx.beginPath();

        ctx.moveTo(
            p,
            0
        );

        ctx.lineTo(
            p,
            boardSize
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            p
        );

        ctx.lineTo(
            boardSize,
            p
        );

        ctx.stroke();
    }


    ctx.strokeStyle =
        "#1c604b";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        1,
        1,
        boardSize - 2,
        boardSize - 2
    );
}


/* =========================================================
   FOOD
========================================================= */

function drawFood(){

    const cx =
        food.x * cell +
        cell / 2;

    const cy =
        food.y * cell +
        cell / 2;

    const radius =
        cell * .31;


    /* glow */

    const glow =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            radius * 3
        );

    glow.addColorStop(
        0,
        "rgba(255,50,100,.45)"
    );

    glow.addColorStop(
        .35,
        "rgba(255,50,100,.12)"
    );

    glow.addColorStop(
        1,
        "rgba(255,50,100,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * 3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* food */

    ctx.fillStyle =
        "#ff376f";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* highlight */

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        cx - radius * .3,
        cy - radius * .3,
        radius * .22,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   SNAKE
========================================================= */

function drawSnake(){

    for(
        let i = snake.length - 1;
        i >= 0;
        i--
    ){

        const part =
            snake[i];

        const x =
            part.x * cell;

        const y =
            part.y * cell;

        const gap =
            Math.max(
                1,
                cell * .07
            );

        const size =
            cell - gap * 2;

        const radius =
            Math.min(
                7,
                cell * .22
            );


        /* shadow */

        ctx.fillStyle =
            "rgba(0,0,0,.35)";

        roundedRect(
            x + gap + 1,
            y + gap + 2,
            size,
            size,
            radius
        );

        ctx.fill();


        /* body */

        if(i === 0){

            const gradient =
                ctx.createLinearGradient(
                    x,
                    y,
                    x + cell,
                    y + cell
                );

            gradient.addColorStop(
                0,
                "#dffff5"
            );

            gradient.addColorStop(
                .2,
                "#50ffd0"
            );

            gradient.addColorStop(
                .65,
                "#00d99b"
            );

            gradient.addColorStop(
                1,
                "#00805f"
            );

            ctx.fillStyle =
                gradient;

        }else{

            const gradient =
                ctx.createLinearGradient(
                    x,
                    y,
                    x + cell,
                    y + cell
                );

            gradient.addColorStop(
                0,
                "#6dffdb"
            );

            gradient.addColorStop(
                .5,
                "#00c992"
            );

            gradient.addColorStop(
                1,
                "#006b50"
            );

            ctx.fillStyle =
                gradient;
        }


        roundedRect(
            x + gap,
            y + gap,
            size,
            size,
            radius
        );

        ctx.fill();


        /* body highlight */

        if(i !== 0){

            ctx.fillStyle =
                "rgba(255,255,255,.10)";

            roundedRect(
                x + gap + 2,
                y + gap + 2,
                size * .72,
                Math.max(
                    2,
                    size * .15
                ),
                radius
            );

            ctx.fill();
        }


        if(i === 0){

            drawEyes(
                x,
                y
            );
        }
    }
}


/* =========================================================
   EYES
========================================================= */

function drawEyes(x,y){

    const cx =
        x + cell / 2;

    const cy =
        y + cell / 2;

    const offset =
        cell * .17;

    const radius =
        Math.max(
            1.5,
            cell * .085
        );

    let a = {
        x:cx,
        y:cy
    };

    let b = {
        x:cx,
        y:cy
    };


    if(currentDirection.x > 0){

        a.x = cx + offset;
        a.y = cy - offset;

        b.x = cx + offset;
        b.y = cy + offset;

    }else if(currentDirection.x < 0){

        a.x = cx - offset;
        a.y = cy - offset;

        b.x = cx - offset;
        b.y = cy + offset;

    }else if(currentDirection.y < 0){

        a.x = cx - offset;
        a.y = cy - offset;

        b.x = cx + offset;
        b.y = cy - offset;

    }else{

        a.x = cx - offset;
        a.y = cy + offset;

        b.x = cx + offset;
        b.y = cy + offset;
    }


    ctx.fillStyle =
        "#00120c";

    ctx.beginPath();

    ctx.arc(
        a.x,
        a.y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        b.x,
        b.y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        a.x - radius * .2,
        a.y - radius * .25,
        radius * .32,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        b.x - radius * .2,
        b.y - radius * .25,
        radius * .32,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   ROUNDED RECT
========================================================= */

function roundedRect(
    x,
    y,
    width,
    height,
    radius
){

    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );

    ctx.beginPath();

    ctx.moveTo(
        x + r,
        y
    );

    ctx.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        r
    );

    ctx.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        r
    );

    ctx.arcTo(
        x,
        y + height,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x + width,
        y,
        r
    );

    ctx.closePath();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    if(
        boardSize <= 0 ||
        cell <= 0
    ){
        return;
    }

    drawBackground();

    drawGrid();

    drawFood();

    drawSnake();
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    function(event){

        const key =
            event.key.toLowerCase();

        if(
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright" ||
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d" ||
            key === " "
        ){

            event.preventDefault();
        }


        if(
            key === "w" ||
            key === "arrowup"
        ){

            changeDirection(
                0,
                -1
            );

        }else if(
            key === "s" ||
            key === "arrowdown"
        ){

            changeDirection(
                0,
                1
            );

        }else if(
            key === "a" ||
            key === "arrowleft"
        ){

            changeDirection(
                -1,
                0
            );

        }else if(
            key === "d" ||
            key === "arrowright"
        ){

            changeDirection(
                1,
                0
            );

        }else if(
            key === " "
        ){

            if(running){
                togglePause();
            }
        }
    },
    {
        passive:false
    }
);

/* =========================================================
   SWIPE SUPPORT
========================================================= */

let swipeX = 0;
let swipeY = 0;
let swiping = false;

board.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length !== 1
        ){
            return;
        }

        swipeX =
            event.touches[0].clientX;

        swipeY =
            event.touches[0].clientY;

        swiping = true;
    },
    {
        passive:true
    }
);

board.addEventListener(
    "touchend",
    function(event){

        if(!swiping){
            return;
        }

        swiping = false;

        const dx =
            event.changedTouches[0].clientX -
            swipeX;

        const dy =
            event.changedTouches[0].clientY -
            swipeY;

        const ax =
            Math.abs(dx);

        const ay =
            Math.abs(dy);

        if(
            Math.max(ax,ay) < 25
        ){
            return;
        }

        if(ax > ay){

            if(dx > 0){

                changeDirection(
                    1,
                    0
                );

            }else{

                changeDirection(
                    -1,
                    0
                );
            }

        }else{

            if(dy > 0){

                changeDirection(
                    0,
                    1
                );

            }else{

                changeDirection(
                    0,
                    -1
                );
            }
        }
    },
    {
        passive:true
    }
);

);
