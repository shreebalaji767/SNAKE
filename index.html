<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>VOID SNAKE 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#020305;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    position:relative;
}

#gameCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
}

/* =========================================================
   VIGNETTE
========================================================= */

#vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
        radial-gradient(
            circle at center,
            transparent 40%,
            rgba(0,0,0,.18) 65%,
            rgba(0,0,0,.75) 100%
        );
}

/* =========================================================
   MAIN MENU
========================================================= */

.screen{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at center,rgba(0,255,170,.08),transparent 45%),
        rgba(0,0,0,.32);
}

.hidden{
    display:none !important;
}

.menu-card{
    width:min(520px,94vw);
    padding:34px 26px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:28px;
    background:rgba(4,9,13,.84);
    backdrop-filter:blur(18px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.08);
    text-align:center;
}

.logo{
    font-size:clamp(38px,9vw,76px);
    font-weight:900;
    letter-spacing:.08em;
    line-height:.9;
    color:#fff;
    text-shadow:
        0 0 10px rgba(0,255,170,.8),
        0 0 35px rgba(0,255,170,.35);
}

.logo span{
    color:#00ffaa;
}

.subtitle{
    margin:14px 0 28px;
    color:#91a7b1;
    letter-spacing:.25em;
    font-size:12px;
    text-transform:uppercase;
}

.menu-buttons{
    display:grid;
    gap:12px;
}

.menu-btn{
    width:100%;
    min-height:58px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    color:#fff;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );
    font-size:16px;
    font-weight:800;
    letter-spacing:.12em;
    cursor:pointer;
    transition:.18s ease;
}

.menu-btn:hover{
    transform:translateY(-2px);
    border-color:rgba(0,255,170,.55);
    box-shadow:0 10px 30px rgba(0,255,170,.12);
}

.menu-btn:active{
    transform:scale(.97);
}

.menu-btn.primary{
    color:#00130d;
    background:linear-gradient(135deg,#00ffaa,#00d5ff);
    border:0;
}

.menu-btn.danger{
    color:#ff7777;
}

.version{
    margin-top:22px;
    color:#52616a;
    font-size:11px;
    letter-spacing:.12em;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:
        max(14px,env(safe-area-inset-top))
        max(14px,env(safe-area-inset-right))
        0
        max(14px,env(safe-area-inset-left));
    pointer-events:none;
}

.hud-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.stat{
    min-width:82px;
    padding:9px 12px;
    border:1px solid rgba(255,255,255,.11);
    border-radius:13px;
    background:rgba(3,8,12,.68);
    backdrop-filter:blur(12px);
}

.stat-label{
    display:block;
    color:#71828b;
    font-size:9px;
    font-weight:700;
    letter-spacing:.16em;
    margin-bottom:3px;
}

.stat-value{
    font-size:17px;
    font-weight:900;
}

#pauseHudBtn{
    pointer-events:auto;
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    color:#fff;
    background:rgba(3,8,12,.72);
    backdrop-filter:blur(12px);
    cursor:pointer;
    font-size:19px;
}

/* =========================================================
   TOUCH CONTROLS
========================================================= */

#touchControls{
    position:fixed;
    inset:0;
    z-index:11;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:max(22px,env(safe-area-inset-left));
    bottom:max(24px,env(safe-area-inset-bottom));
    width:140px;
    height:140px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.22);
    backdrop-filter:blur(8px);
    pointer-events:auto;
}

#joystickKnob{
    position:absolute;
    width:62px;
    height:62px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#72ffe0,#00d79a 60%,#008866);
    box-shadow:
        0 0 25px rgba(0,255,170,.35);
}

.touch-action{
    position:absolute;
    right:max(22px,env(safe-area-inset-right));
    bottom:max(24px,env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:12px;
    pointer-events:auto;
}

.touch-btn{
    width:76px;
    height:76px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.17);
    color:#fff;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    font-weight:900;
    font-size:12px;
}

.touch-btn.boost{
    background:
        radial-gradient(circle,#00ffaa33,#001c16cc);
    border-color:#00ffaa66;
}

.touch-btn:active{
    transform:scale(.93);
}

/* =========================================================
   PAUSE / GAME OVER
========================================================= */

.overlay-card{
    width:min(440px,92vw);
    padding:30px 24px;
    border-radius:24px;
    background:rgba(4,8,12,.9);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14);
    text-align:center;
    box-shadow:0 25px 80px rgba(0,0,0,.65);
}

.overlay-title{
    margin:0 0 8px;
    font-size:38px;
    font-weight:900;
    letter-spacing:.06em;
}

.overlay-text{
    margin:0 0 24px;
    color:#899aa3;
}

.overlay-buttons{
    display:grid;
    gap:10px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .menu-card{
        padding:28px 18px;
        border-radius:22px;
    }

    .stat{
        min-width:72px;
        padding:8px 10px;
    }

    .stat-value{
        font-size:15px;
    }

    #pauseHudBtn{
        width:44px;
        height:44px;
    }

    #joystick{
        width:126px;
        height:126px;
    }

    #joystickKnob{
        width:56px;
        height:56px;
    }

    .touch-btn{
        width:68px;
        height:68px;
    }
}

@media(max-height:520px) and (orientation:landscape){

    .menu-card{
        padding:18px;
    }

    .logo{
        font-size:38px;
    }

    .subtitle{
        margin:8px 0 14px;
    }

    .menu-btn{
        min-height:45px;
    }

    #joystick{
        width:100px;
        height:100px;
    }

    #joystickKnob{
        width:45px;
        height:45px;
    }

    .touch-btn{
        width:58px;
        height:58px;
    }
}
</style>

<!-- =========================================================
     THREE.JS
========================================================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="vignette"></div>

<!-- =========================================================
     MAIN MENU
========================================================= -->

<section id="mainMenu" class="screen">

    <div class="menu-card">

        <div class="logo">
            VOID<span>SNAKE</span>
            <div style="font-size:.48em;margin-top:8px;">
                3D
            </div>
        </div>

        <div class="subtitle">
            SURVIVE • HUNT • GROW
        </div>

        <div class="menu-buttons">

            <button id="playBtn"
                    class="menu-btn primary">
                ▶ PLAY
            </button>

            <button id="menuPauseBtn"
                    class="menu-btn">
                ⏸ PAUSE / RESUME
            </button>

            <button id="exitBtn"
                    class="menu-btn danger">
                ✕ EXIT
            </button>

        </div>

        <div class="version">
            VOID SNAKE 3D • THREE.JS
        </div>

    </div>

</section>

<!-- =========================================================
     HUD
========================================================= -->

<div id="hud" class="hidden">

    <div class="hud-row">

        <div class="stats">

            <div class="stat">
                <span class="stat-label">SCORE</span>
                <span id="scoreValue" class="stat-value">0</span>
            </div>

            <div class="stat">
                <span class="stat-label">LENGTH</span>
                <span id="lengthValue" class="stat-value">8</span>
            </div>

            <div class="stat">
                <span class="stat-label">SPEED</span>
                <span id="speedValue" class="stat-value">1.0</span>
            </div>

        </div>

        <button id="pauseHudBtn">Ⅱ</button>

    </div>

</div>

<!-- =========================================================
     TOUCH CONTROLS
========================================================= -->

<div id="touchControls" class="hidden">

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <div class="touch-action">

        <button id="boostBtn"
                class="touch-btn boost">
            BOOST
        </button>

        <button id="touchPauseBtn"
                class="touch-btn">
            Ⅱ
        </button>

    </div>

</div>

<!-- =========================================================
     PAUSE
========================================================= -->

<section id="pauseScreen"
         class="screen hidden">

    <div class="overlay-card">

        <h1 class="overlay-title">
            PAUSED
        </h1>

        <p class="overlay-text">
            The snake is waiting.
        </p>

        <div class="overlay-buttons">

            <button id="resumeBtn"
                    class="menu-btn primary">
                ▶ RESUME
            </button>

            <button id="restartBtn"
                    class="menu-btn">
                ↻ RESTART
            </button>

            <button id="pauseExitBtn"
                    class="menu-btn danger">
                ✕ EXIT
            </button>

        </div>

    </div>

</section>

<!-- =========================================================
     GAME OVER
========================================================= -->

<section id="gameOverScreen"
         class="screen hidden">

    <div class="overlay-card">

        <h1 class="overlay-title">
            GAME OVER
        </h1>

        <p class="overlay-text">
            Your snake could not survive.
        </p>

        <div style="
            margin:-8px 0 22px;
            font-size:28px;
            font-weight:900;
            color:#00ffaa;
        ">
            SCORE
            <span id="finalScore">0</span>
        </div>

        <div class="overlay-buttons">

            <button id="playAgainBtn"
                    class="menu-btn primary">
                ▶ PLAY AGAIN
            </button>

            <button id="gameOverExitBtn"
                    class="menu-btn danger">
                ✕ EXIT
            </button>

        </div>

    </div>

</section>

<script type="module">

import * as THREE from "three";

/* =========================================================
   DOM
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const mainMenu =
    document.getElementById("mainMenu");

const hud =
    document.getElementById("hud");

const touchControls =
    document.getElementById("touchControls");

const pauseScreen =
    document.getElementById("pauseScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const scoreValue =
    document.getElementById("scoreValue");

const lengthValue =
    document.getElementById("lengthValue");

const speedValue =
    document.getElementById("speedValue");

const finalScore =
    document.getElementById("finalScore");

const joystick =
    document.getElementById("joystick");

const joystickKnob =
    document.getElementById("joystickKnob");

/* =========================================================
   THREE.JS CORE
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.1;

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x061017);

scene.fog =
    new THREE.FogExp2(
        0x061017,
        0.018
    );

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        500
    );

camera.position.set(
    0,
    8,
    12
);

/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0x9eeaff,
        0x07100c,
        1.7
    );

scene.add(hemi);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    30,
    50,
    20
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);

const moon =
    new THREE.PointLight(
        0x00ffaa,
        8,
        80
    );

moon.position.set(
    -20,
    12,
    -20
);

scene.add(moon);

/* =========================================================
   WORLD
========================================================= */

const WORLD_SIZE = 180;

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x10251d,
        roughness:.92,
        metalness:.02
    });

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            WORLD_SIZE,
            WORLD_SIZE,
            40,
            40
        ),
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);

/* =========================================================
   GROUND GRID
========================================================= */

const grid =
    new THREE.GridHelper(
        WORLD_SIZE,
        45,
        0x16493d,
        0x0d2b25
    );

grid.position.y = .015;

scene.add(grid);

/* =========================================================
   WORLD ROCKS
========================================================= */

const rocks = [];

function createRock(
    x,
    z,
    scale,
    color = 0x26352f
){

    const geometry =
        new THREE.DodecahedronGeometry(
            1,
            1
        );

    const material =
        new THREE.MeshStandardMaterial({
            color,
            roughness:.95
        });

    const rock =
        new THREE.Mesh(
            geometry,
            material
        );

    rock.position.set(
        x,
        scale * .55,
        z
    );

    rock.scale.set(
        scale,
        scale * (.6 + Math.random()*.5),
        scale
    );

    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    rock.castShadow = true;
    rock.receiveShadow = true;

    scene.add(rock);
    rocks.push(rock);
}

for(let i=0;i<85;i++){

    const x =
        (Math.random()-.5) *
        (WORLD_SIZE-15);

    const z =
        (Math.random()-.5) *
        (WORLD_SIZE-15);

    const s =
        .35 +
        Math.random()*1.8;

    createRock(x,z,s);
}

/* =========================================================
   TREES
========================================================= */

function createTree(x,z){

    const group =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .18,
                .3,
                2.4,
                7
            ),
            new THREE.MeshStandardMaterial({
                color:0x3b2416,
                roughness:1
            })
        );

    trunk.position.y = 1.2;
    trunk.castShadow = true;

    group.add(trunk);

    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.25,
                3.2,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x0c4c31,
                roughness:.9
            })
        );

    leaves.position.y = 3.1;
    leaves.castShadow = true;

    group.add(leaves);

    group.position.set(x,0,z);

    scene.add(group);
}

for(let i=0;i<55;i++){

    const x =
        (Math.random()-.5) *
        (WORLD_SIZE-20);

    const z =
        (Math.random()-.5) *
        (WORLD_SIZE-20);

    createTree(x,z);
}

/* =========================================================
   SNAKE
========================================================= */

const snakeGroup =
    new THREE.Group();

scene.add(snakeGroup);

const snakeSegments = [];

const SNAKE_START_LENGTH = 8;

let snakeLength =
    SNAKE_START_LENGTH;

let snakeHead =
    new THREE.Vector3(
        0,
        .65,
        0
    );

let direction =
    new THREE.Vector3(
        0,
        0,
        -1
    );

let desiredDirection =
    direction.clone();

let bodySpacing = .72;

function createSnakeHead(){

    const group =
        new THREE.Group();

    /* head */

    const headGeometry =
        new THREE.SphereGeometry(
            .7,
            24,
            16
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({
            color:0x00b87a,
            roughness:.42,
            metalness:.1
        });

    const head =
        new THREE.Mesh(
            headGeometry,
            headMaterial
        );

    head.scale.set(
        1,
        .78,
        1.18
    );

    head.castShadow = true;

    group.add(head);

    /* eyes */

    const eyeGeometry =
        new THREE.SphereGeometry(
            .13,
            12,
            8
        );

    const eyeMaterial =
        new THREE.MeshStandardMaterial({
            color:0x020202,
            roughness:.15,
            metalness:.1
        });

    const eyeL =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    const eyeR =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    eyeL.position.set(
        -.34,
        .17,
        -.46
    );

    eyeR.position.set(
        .34,
        .17,
        -.46
    );

    group.add(eyeL);
    group.add(eyeR);

    /* eye glow */

    const glowGeometry =
        new THREE.SphereGeometry(
            .045,
            8,
            8
        );

    const glowMaterial =
        new THREE.MeshBasicMaterial({
            color:0x8affdd
        });

    const glowL =
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );

    const glowR =
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );

    glowL.position.set(
        -.34,
        .19,
        -.57
    );

    glowR.position.set(
        .34,
        .19,
        -.57
    );

    group.add(glowL);
    group.add(glowR);

    /* tongue */

    const tongueMaterial =
        new THREE.MeshBasicMaterial({
            color:0xff3050
        });

    const tongue =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .018,
                .018,
                .75,
                6
            ),
            tongueMaterial
        );

    tongue.rotation.x =
        Math.PI/2;

    tongue.position.set(
        0,
        -.03,
        -.75
    );

    group.add(tongue);

    return group;
}

const head =
    createSnakeHead();

snakeGroup.add(head);

function createBodySegment(index){

    const geometry =
        new THREE.SphereGeometry(
            .56,
            18,
            14
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                index % 2 === 0
                ? 0x00a96f
                : 0x00885c,
            roughness:.48,
            metalness:.08
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.scale.set(
        1,
        .82,
        1.05
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}

for(
    let i=0;
    i<SNAKE_START_LENGTH;
    i++
){

    const segment =
        createBodySegment(i);

    segment.position.set(
        0,
        .58,
        i * bodySpacing
    );

    snakeGroup.add(segment);

    snakeSegments.push({
        mesh:segment,
        position:new THREE.Vector3(
            0,
            .58,
            i * bodySpacing
        )
    });
}

/* =========================================================
   FOOD
========================================================= */

let food =
    null;

function createFood(){

    if(food){
        scene.remove(food);
    }

    const group =
        new THREE.Group();

    const core =
        new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                .38,
                2
            ),
            new THREE.MeshStandardMaterial({
                color:0xffc400,
                emissive:0xff7a00,
                emissiveIntensity:2,
                roughness:.22,
                metalness:.15
            })
        );

    core.castShadow = true;

    group.add(core);

    const light =
        new THREE.PointLight(
            0xffaa00,
            5,
            8
        );

    group.add(light);

    let x;
    let z;

    do{

        x =
            (Math.random()-.5) *
            (WORLD_SIZE-20);

        z =
            (Math.random()-.5) *
            (WORLD_SIZE-20);

    }while(
        Math.hypot(
            x-snakeHead.x,
            z-snakeHead.z
        ) < 10
    );

    group.position.set(
        x,
        .7,
        z
    );

    scene.add(group);

    food = group;
}

createFood();

/* =========================================================
   PARTICLES
========================================================= */

const particles = [];

function createPickupEffect(position){

    for(let i=0;i<18;i++){

        const material =
            new THREE.MeshBasicMaterial({
                color:
                    i%2
                    ? 0x00ffaa
                    : 0xffc400
            });

        const particle =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .06,
                    6,
                    6
                ),
                material
            );

        particle.position.copy(position);

        particle.userData.velocity =
            new THREE.Vector3(
                (Math.random()-.5)*4,
                Math.random()*4,
                (Math.random()-.5)*4
            );

        particle.userData.life = 1;

        scene.add(particle);

        particles.push(particle);
    }
}

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.userData.life -= dt;

        p.position.addScaledVector(
            p.userData.velocity,
            dt
        );

        p.userData.velocity.y -=
            5 * dt;

        p.scale.setScalar(
            Math.max(
                0,
                p.userData.life
            )
        );

        if(
            p.userData.life <= 0
        ){

            scene.remove(p);

            particles.splice(i,1);
        }
    }
}

/* =========================================================
   GAME STATE
========================================================= */

let gameRunning = false;
let gamePaused = false;
let gameOver = false;

let score = 0;

let baseSpeed = 5.2;

let boost = false;

let lastTime = 0;

function pauseGame(){

function resumeGame(){

    }

    gamePaused = false;

    pauseScreen.classList.add(
        "hidden"
    );
}

function exitGame(){

    gameRunning = false;
    gamePaused = false;
    gameOver = false;

}

/* =========================================================
   START / RESET
========================================================= */

function resetGame(){

    score = 0;

    snakeLength =
        SNAKE_START_LENGTH;

    baseSpeed = 5.2;

    snakeHead.set(
        0,
        .65,
        0
    );

    direction.set(
        0,
        0,
        -1
    );

    desiredDirection.set(
        0,
        0,
        -1
    );

    head.position.set(
        0,
        .65,
        0
    );

    head.rotation.set(
        0,
        0,
        0
    );

    for(
        let i=0;
        i<snakeSegments.length;
        i++
    ){

        const p =
            new THREE.Vector3(
                0,
                .58,
                i * bodySpacing
            );

        snakeSegments[i].position.copy(
            p
        );

        snakeSegments[i].mesh.position.copy(
            p
        );
    }

    createFood();

    updateHUD();

    camera.position.set(
        0,
        8,
        12
    );

    camera.lookAt(
        snakeHead.x,
        0,
        snakeHead.z
    );
}

function startGame(){

    resetGame();

    gameRunning = true;
    gamePaused = false;
    gameOver = false;

    showGame();
}

/* =========================================================
   GROW SNAKE
========================================================= */

function growSnake(){

    const index =
        snakeSegments.length;

    const segment =
        createBodySegment(index);

    const last =
        snakeSegments[
            snakeSegments.length-1
        ].position;

    segment.position.copy(last);

    scene.add(segment);

    snakeSegments.push({
        mesh:segment,
        position:last.clone()
    });
}

/* =========================================================
   INPUT
========================================================= */

function setDirection(x,z){

    const next =
        new THREE.Vector3(
            x,
            0,
            z
        ).normalize();

    /*
       Prevent immediate 180 degree turn.
    */

    if(
        next.dot(direction) <
        -0.85
    ){
        return;
    }

    desiredDirection.copy(next);
}

/* keyboard */

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if(
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " ",
                "w",
                "a",
                "s",
                "d"
            ].includes(key)
        ){

            event.preventDefault();
        }

        if(
            key === "arrowup" ||
            key === "w"
        ){

            setDirection(
                0,
                -1
            );

        }else if(
            key === "arrowdown" ||
            key === "s"
        ){

            setDirection(
                0,
                1
            );

        }else if(
            key === "arrowleft" ||
            key === "a"
        ){

            setDirection(
                -1,
                0
            );

        }else if(
            key === "arrowright" ||
            key === "d"
        ){

            setDirection(
                1,
                0
            );

        }else if(
            key === "escape" ||
            key === " "
        ){

            if(gamePaused){
                resumeGame();
            }else{
                pauseGame();
            }
        }

    },
    {
        passive:false
    }
);

/* =========================================================
   JOYSTICK
========================================================= */

let joystickActive = false;

function updateJoystick(clientX,clientY){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width/2;

    const centerY =
        rect.top +
        rect.height/2;

    let dx =
        clientX-centerX;

    let dy =
        clientY-centerY;

    const max =
        rect.width*.35;

    const distance =
        Math.hypot(dx,dy);

    if(distance > max){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;
    }

    joystickKnob.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

    if(
        Math.hypot(dx,dy) > 12
    ){

        const nx =
            dx / max;

        const ny =
            dy / max;

        if(
            Math.abs(nx) >
            Math.abs(ny)
        ){

            setDirection(
                nx > 0 ? 1 : -1,
                0
            );

        }else{

            setDirection(
                0,
                ny > 0 ? 1 : -1
            );
        }
    }
}

function resetJoystick(){

    joystickActive = false;

    joystickKnob.style.transform =
        "translate(-50%,-50%)";
}

joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive = true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    event => {

        if(!joystickActive){
            return;
        }

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =========================================================
   BOOST
========================================================= */

const boostBtn =
    document.getElementById(
        "boostBtn"
    );

function startBoost(){

}

function stopBoost(){

}

boostBtn.addEventListener(

boostBtn.addEventListener(

boostBtn.addEventListener(

window.addEventListener(

window.addEventListener(

        }
    }
);

/* =========================================================
   SNAKE MOVEMENT
========================================================= */

function moveSnake(dt){

    direction.lerp(
        desiredDirection,
        Math.min(
            1,
            dt * 9
        )
    );

    direction.normalize();

    const speed =
        baseSpeed *
        (boost ? 1.7 : 1);

    const movement =
        direction.clone()
        .multiplyScalar(
            speed * dt
        );

    snakeHead.add(
        movement
    );

    /*
       World boundary
    */

    const limit =
        WORLD_SIZE/2 - 5;

    if(
        Math.abs(snakeHead.x) >
        limit ||
        Math.abs(snakeHead.z) >
        limit
    ){

        endGame();

        return;
    }

    /*
       Move body
    */

    let previous =
        snakeHead.clone();

    for(
        let i=0;
        i<snakeSegments.length;
        i++
    ){

        const seg =
            snakeSegments[i];

        const target =
            previous.clone();

        const difference =
            target.clone()
            .sub(seg.position);

        const distance =
            difference.length();

        if(
            distance >
            bodySpacing
        ){

            seg.position.add(
                difference
                .normalize()
                .multiplyScalar(
                    distance-bodySpacing
                )
            );
        }

        seg.mesh.position.copy(
            seg.position
        );

        previous =
            seg.position.clone();
    }

    head.position.copy(
        snakeHead
    );

    /*
       Rotate snake toward direction.
    */

    const targetAngle =
        Math.atan2(
            -direction.x,
            -direction.z
        );

    head.rotation.y =
        THREE.MathUtils.lerp(
            head.rotation.y,
            targetAngle,
            Math.min(
                1,
                dt*10
            )
        );
}

/* =========================================================
   FOOD COLLISION
========================================================= */

function checkFood(){

    if(!food){
        return;
    }

    const distance =
        snakeHead.distanceTo(
            food.position
        );

    if(distance < 1.45){

        score += 10;

        snakeLength++;

        baseSpeed =
            Math.min(
                11,
                5.2 +
                snakeLength*.11
            );

        growSnake();

        createPickupEffect(
            food.position.clone()
        );

        createFood();

        updateHUD();
    }
}

/* =========================================================
   SELF COLLISION
========================================================= */

function checkSelfCollision(){

    if(
        snakeSegments.length < 6
    ){
        return;
    }

    for(
        let i=4;
        i<snakeSegments.length;
        i++
    ){

        const distance =
            snakeHead.distanceTo(
                snakeSegments[i].position
            );

        if(distance < .65){

            endGame();

            return;
        }
    }
}

/* =========================================================
   END GAME
========================================================= */

function endGame(){

    if(gameOver){
        return;
    }

    gameOver = true;
    gameRunning = false;
    gamePaused = false;
    boost = false;

    finalScore.textContent =
        score;

    gameOverScreen.classList.remove(
        "hidden"
    );

    hud.classList.add(
        "hidden"
    );

    touchControls.classList.add(
        "hidden"
    );
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const behind =
        direction.clone()
        .multiplyScalar(-10);

    const desired =
        snakeHead.clone()
        .add(behind);

    desired.y = 7.5;

    camera.position.lerp(
        desired,
        Math.min(
            1,
            dt*3.5
        )
    );

    cameraTarget.lerp(
        snakeHead,
        Math.min(
            1,
            dt*5
        )
    );

    cameraTarget.y = 0;

    camera.lookAt(
        cameraTarget
    );
}

/* =========================================================
   ANIMATION
========================================================= */

function animateWorld(time){

    /*
       Food floating animation
    */

    if(food){

        food.rotation.y +=
            .0025 * time;

        food.rotation.x +=
            .0012;

        food.position.y =
            .7 +
            Math.sin(time*.004)*.18;
    }

    /*
       Snake subtle breathing
    */

    if(head){

        const scale =
            1 +
            Math.sin(time*.006)*.025;

        head.scale.set(
            scale,
            scale*.78,
            scale*1.18
        );
    }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(time){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        gameRunning &&
        !gamePaused &&
        !gameOver
    ){

        moveSnake(dt);

        checkFood();

        checkSelfCollision();

        updateCamera(dt);
    }

    updateParticles(dt);

    animateWorld(time);

    renderer.render(
        scene,
        camera
    );
}

requestAnimationFrame(
    animate
);
