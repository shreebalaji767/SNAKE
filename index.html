<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>VOID SNAKE</title>

<style>
/* =========================================================
   VOID SNAKE
   CLASSIC RESPONSIVE SNAKE
   ========================================================= */

:root {
  --bg: #030605;
  --panel: #09100d;
  --panel2: #0d1712;
  --border: #30483a;
  --border-light: #466451;
  --text: #edfff3;
  --muted: #8da197;
  --green: #8dffb1;
  --green-dark: #183622;
  --danger: #542d29;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(
      circle at 50% 0%,
      #16221c 0%,
      #080d0a 42%,
      #020403 100%
    );

  color: var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow-x: hidden;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

button {
  font-family: inherit;
  border: 0;
  outline: none;
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.game-shell {
  width: min(96vw, 760px);
  margin: 0 auto;

  padding:
    max(10px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));

  min-height: 100vh;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
  width: 100%;

  display: grid;
  grid-template-columns: 48px 1fr 48px;

  align-items: center;

  min-height: 62px;

  margin-bottom: 8px;
}

.header-side {
  width: 48px;
  height: 48px;
}

.logo {
  min-width: 0;

  width: 100%;

  text-align: center;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;

  font-size: clamp(24px, 7vw, 58px);
  line-height: 1;

  font-weight: 900;

  letter-spacing: clamp(1px, 0.9vw, 7px);

  color: #effff5;

  text-shadow:
    0 0 8px rgba(141, 255, 177, 0.30),
    0 0 24px rgba(141, 255, 177, 0.10);
}

/* =========================================================
   MENU BUTTON
   ========================================================= */

.menu-button {
  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid var(--border-light);
  border-radius: 13px;

  background:
    linear-gradient(
      180deg,
      #14221a,
      #09110d
    );

  color: #e9fff1;

  font-size: 24px;
  font-weight: 900;

  cursor: pointer;

  touch-action: manipulation;
}

.menu-button:active {
  transform: scale(0.94);
}

/* =========================================================
   HUD
   ========================================================= */

.hud {
  width: 100%;

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  margin-bottom: 10px;
}

.hud-card {
  min-width: 0;

  padding: 8px 10px;

  border: 1px solid #263a30;
  border-radius: 11px;

  background: rgba(8, 15, 11, 0.95);

  text-align: center;
}

.hud-label {
  color: #718279;

  font-size: 9px;
  font-weight: 800;

  letter-spacing: 1.5px;
}

.hud-value {
  margin-top: 2px;

  color: #e7fff0;

  font-size: clamp(18px, 5vw, 25px);
  font-weight: 900;
}

/* =========================================================
   BOARD
   ========================================================= */

.board-area {
  position: relative;

  width: 100%;

  display: flex;
  justify-content: center;
}

#gameCanvas {
  display: block;

  width: min(100%, 600px);
  height: auto;

  aspect-ratio: 1 / 1;

  border: 2px solid #344c3e;
  border-radius: 15px;

  background: #040705;

  image-rendering: pixelated;

  touch-action: none;

  box-shadow:
    0 0 0 1px rgba(255,255,255,0.02) inset,
    0 15px 45px rgba(0,0,0,0.55);
}

/* =========================================================
   OVERLAY
   ========================================================= */

.overlay {
  position: absolute;

  inset: 2px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 15px;

  border-radius: 13px;

  background: rgba(2, 6, 4, 0.88);

  z-index: 20;
}

.overlay.hidden {
  display: none;
}

.overlay-panel {
  width: min(92%, 390px);

  padding: 24px 18px;

  border: 1px solid #385344;
  border-radius: 20px;

  background:
    linear-gradient(
      145deg,
      #142019,
      #070d0a
    );

  text-align: center;

  box-shadow:
    0 20px 55px rgba(0,0,0,0.65);
}

.overlay-title {
  margin-bottom: 8px;

  font-size: clamp(25px, 8vw, 40px);
  line-height: 1;

  letter-spacing: 2px;
  font-weight: 900;
}

.overlay-text {
  margin-bottom: 18px;

  color: var(--muted);

  font-size: 14px;
  line-height: 1.5;
}

/* =========================================================
   MENU OPTIONS
   ========================================================= */

.menu-options {
  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;
}

.menu-option {
  width: 100%;

  min-height: 48px;

  padding: 11px 14px;

  border: 1px solid #395744;
  border-radius: 12px;

  background:
    linear-gradient(
      180deg,
      #17281e,
      #0b1510
    );

  color: #edfff3;

  font-size: 14px;
  font-weight: 900;

  letter-spacing: 0.8px;

  cursor: pointer;

  touch-action: manipulation;
}

.menu-option:active {
  transform: scale(0.97);
}

.menu-option.primary {
  background:
    linear-gradient(
      180deg,
      #285336,
      #15301f
    );

  border-color: #659875;
}

.menu-option.danger {
  background:
    linear-gradient(
      180deg,
      #351d1a,
      #1c100e
    );

  border-color: #63423e;
}

/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

.mobile-controls {
  width: min(260px, 80vw);

  margin: 14px auto 0;

  display: grid;

  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);

  gap: 7px;
}

.control-button {
  min-width: 0;

  min-height: 58px;

  border: 1px solid #385343;
  border-radius: 14px;

  background:
    linear-gradient(
      180deg,
      #15251b,
      #09110d
    );

  color: #e6fff0;

  font-size: 25px;
  font-weight: 900;

  cursor: pointer;

  touch-action: manipulation;
}

.control-button:active {
  transform: scale(0.93);

  background: #1d3927;
}

.control-empty {
  visibility: hidden;
}

/* =========================================================
   MOBILE CONTROL LABEL
   ========================================================= */

.control-label {
  margin-top: 12px;

  text-align: center;

  color: #66786e;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: 1.5px;
}

/* =========================================================
   HELP
   ========================================================= */

.help {
  margin-top: 12px;

  text-align: center;

  color: #63736a;

  font-size: 11px;

  line-height: 1.55;
}

.help strong {
  color: #8da499;
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

  .game-shell {
    width: 98vw;
  }

  .header {
    grid-template-columns: 42px 1fr 42px;
    min-height: 54px;
  }

  .header-side,
  .menu-button {
    width: 42px;
    height: 42px;
  }

  .menu-button {
    font-size: 21px;
    border-radius: 11px;
  }

  .logo {
    font-size: clamp(22px, 8.5vw, 34px);
    letter-spacing: 1px;
  }

  .mobile-controls {
    width: min(220px, 75vw);
  }

  .control-button {
    min-height: 50px;
    font-size: 21px;
  }

}

/* =========================================================
   TABLETS / IPAD
   ========================================================= */

@media (min-width: 600px) {

  .game-shell {
    padding-top: 18px;
  }

  .mobile-controls {
    width: 240px;
  }

  .control-button {
    min-height: 54px;
  }

}

/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 900px) {

  .game-shell {
    padding-top: 20px;
  }

  .mobile-controls {
    width: 230px;
  }

  .control-button {
    min-height: 50px;
  }

}
</style>
</head>

<body>

<main class="game-shell">

  <!-- =====================================================

  <header class="header">

    <div class="header-side"></div>

    </div>

    <div class="hud-card">

      <div

    <div class="hud-card">

  <!-- =====================================================

  <section class="board-area">

          <button
            type="button"

<script>
"use strict";

/* =========================================================
   VOID SNAKE GAME
   ========================================================= */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

const GRID = 30;

const CELL =
  canvas.width / GRID;

const START_LENGTH = 3;

const START_SPEED = 140;

const MIN_SPEED = 65;

const SPEED_STEP = 4;

let snake = [];

let food = {
  x: 15,
  y: 15
};

let direction = {
  x: 1,
  y: 0
};

let nextDirection = {
  x: 1,
  y: 0
};

let score = 0;

let speed = START_SPEED;

let timer = null;

let state = "menu";

let touchStartX = 0;
let touchStartY = 0;

/* =========================================================
   DOM
   ========================================================= */

const scoreValue =
  document.getElementById("scoreValue");

const lengthValue =
  document.getElementById("lengthValue");

const menuButton =
  document.getElementById("menuButton");

const startOverlay =
  document.getElementById("startOverlay");

const menuOverlay =
  document.getElementById("menuOverlay");

const pauseOverlay =
  document.getElementById("pauseOverlay");

const gameOverOverlay =
  document.getElementById("gameOverOverlay");

const startPlayButton =
  document.getElementById("startPlayButton");

const menuPlayButton =
  document.getElementById("menuPlayButton");

const menuPauseButton =
  document.getElementById("menuPauseButton");

const menuResumeButton =
  document.getElementById("menuResumeButton");

const menuExitButton =
  document.getElementById("menuExitButton");

const pauseResumeButton =
  document.getElementById("pauseResumeButton");

const pauseMenuButton =
  document.getElementById("pauseMenuButton");

const pauseExitButton =
  document.getElementById("pauseExitButton");

const gameOverPlayButton =
  document.getElementById("gameOverPlayButton");

const gameOverMenuButton =
  document.getElementById("gameOverMenuButton");

const gameOverExitButton =
  document.getElementById("gameOverExitButton");

const finalScore =
  document.getElementById("finalScore");

const finalLength =
  document.getElementById("finalLength");

/* =========================================================
   CREATE SNAKE
   ========================================================= */

function createSnake() {

  snake = [];

  const centerX =
    Math.floor(GRID / 2);

  const centerY =
    Math.floor(GRID / 2);

  for (
    let i = 0;
    i < START_LENGTH;
    i++
  ) {

    snake.push({
      x: centerX - i,
      y: centerY
    });

  }

}

/* =========================================================
   RESET
   ========================================================= */

function resetGame() {

  stopTimer();

  score = 0;

  speed = START_SPEED;

  direction = {
    x: 1,
    y: 0
  };

  nextDirection = {
    x: 1,
    y: 0
  };

  createSnake();

  placeFood();

  updateHUD();

  draw();

}

/* =========================================================
   START
   ========================================================= */

function startGame() {

  resetGame();

  state = "playing";

  hideAllOverlays();

  startTimer();

}

/* =========================================================
   TIMER
   ========================================================= */

function startTimer() {

  stopTimer();

  timer = setInterval(
    gameTick,
    speed
  );

}

function stopTimer() {

  if (timer !== null) {

    clearInterval(timer);

    timer = null;

  }

}

/* =========================================================
   GAME TICK
   ========================================================= */

function gameTick() {

  if (state !== "playing") {
    return;
  }

  direction = nextDirection;

  const head = snake[0];

  const newHead = {
    x: head.x + direction.x,
    y: head.y + direction.y
  };

  /* WALL */

  if (
    newHead.x < 0 ||
    newHead.x >= GRID ||
    newHead.y < 0 ||
    newHead.y >= GRID
  ) {

    gameOver();

    return;

  }

  const eating =
    newHead.x === food.x &&
    newHead.y === food.y;

  /* SELF COLLISION */

  const collisionLimit =
    eating
      ? snake.length
      : snake.length - 1;

  for (
    let i = 0;
    i < collisionLimit;
    i++
  ) {

    if (
      newHead.x === snake[i].x &&
      newHead.y === snake[i].y
    ) {

      gameOver();

      return;

    }

  }

  snake.unshift(newHead);

  if (eating) {

    score += 10;

    /*
     * Snake gradually gets faster.
     * There are NO levels.
     */

    speed = Math.max(
      MIN_SPEED,
      START_SPEED -
      Math.floor(score / 50) * SPEED_STEP
    );

    placeFood();

    startTimer();

  } else {

    snake.pop();

  }

  updateHUD();

  draw();

}

/* =========================================================
   FOOD
   ========================================================= */

function placeFood() {

  let valid = false;

  while (!valid) {

    food.x =
      Math.floor(
        Math.random() * GRID
      );

    food.y =
      Math.floor(
        Math.random() * GRID
      );

    valid = true;

    for (const part of snake) {

      if (
        part.x === food.x &&
        part.y === food.y
      ) {

        valid = false;

        break;

      }

    }

  }

}

/* =========================================================
   DIRECTION
   ========================================================= */

function setDirection(name) {

  if (state !== "playing") {
    return;
  }

  let newDirection = null;

  if (name === "up") {

    newDirection = {
      x: 0,
      y: -1
    };

  }

  if (name === "down") {

    newDirection = {
      x: 0,
      y: 1
    };

  }

  if (name === "left") {

    newDirection = {
      x: -1,
      y: 0
    };

  }

  if (name === "right") {

    newDirection = {
      x: 1,
      y: 0
    };

  }

  if (!newDirection) {
    return;
  }

  /*
   * Prevent reversing into itself.
   */

  if (
    newDirection.x === -direction.x &&
    newDirection.y === -direction.y
  ) {

    return;

  }

  nextDirection = newDirection;

}

/* =========================================================
   PAUSE
   ========================================================= */

function pauseGame() {

  if (state !== "playing") {
    return;
  }

  state = "paused";

  stopTimer();

  hideAllOverlays();

  pauseOverlay.classList.remove("hidden");

}

/* =========================================================
   RESUME
   ========================================================= */

function resumeGame() {

  if (state !== "paused") {
    return;
  }

  state = "playing";

  hideAllOverlays();

  startTimer();

}

/* =========================================================
   OPEN MENU
   ========================================================= */

function openMenu() {

  /*
   * From the menu itself, simply show it.
   */

  if (state === "menu") {

    hideAllOverlays();

    startOverlay.classList.remove("hidden");

    return;

  }

  /*
   * If playing, pause automatically while menu
   * is open.
   */

  if (state === "playing") {

    stopTimer();

    state = "paused";

  }

  hideAllOverlays();

  menuOverlay.classList.remove("hidden");

  updateMenuButtons();

}

/* =========================================================
   CLOSE MENU
   ========================================================= */

function closeMenuAndResume() {

  if (state !== "paused") {
    return;
  }

  resumeGame();

}

/* =========================================================
   MENU BUTTON VISIBILITY
   ========================================================= */

function updateMenuButtons() {

  if (state === "playing") {

    menuPlayButton.style.display =
      "block";

    menuPauseButton.style.display =
      "block";

    menuResumeButton.style.display =
      "none";

    return;

  }

  if (state === "paused") {

    menuPlayButton.style.display =
      "none";

    menuPauseButton.style.display =
      "none";

    menuResumeButton.style.display =
      "block";

    return;

  }

  menuPlayButton.style.display =
    "block";

  menuPauseButton.style.display =
    "none";

  menuResumeButton.style.display =
    "none";

}

/* =========================================================
   EXIT
   ========================================================= */

function exitGame() {

  stopTimer();

  resetGame();

  state = "menu";

  hideAllOverlays();

  startOverlay.classList.remove("hidden");

}

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver() {

  stopTimer();

  state = "gameover";

  finalScore.textContent =
    String(score);

  finalLength.textContent =
    String(snake.length);

  hideAllOverlays();

  gameOverOverlay.classList.remove(
    "hidden"
  );

  draw();

}

/* =========================================================
   OVERLAYS
   ========================================================= */

function hideAllOverlays() {

  startOverlay.classList.add("hidden");

  menuOverlay.classList.add("hidden");

  pauseOverlay.classList.add("hidden");

  gameOverOverlay.classList.add("hidden");

}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

  scoreValue.textContent =
    String(score);

  lengthValue.textContent =
    String(snake.length);

}

/* =========================================================
   DRAW
   ========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();

  drawGrid();

  drawFood();

  drawSnake();

}

/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground() {

  ctx.fillStyle =
    "#040705";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}

/* =========================================================
   GRID
   ========================================================= */

function drawGrid() {

  ctx.strokeStyle =
    "rgba(120,150,130,0.065)";

  ctx.lineWidth = 1;

  for (
    let i = 0;
    i <= GRID;
    i++
  ) {

    const p =
      i * CELL;

    ctx.beginPath();

    ctx.moveTo(
      p,
      0
    );

    ctx.lineTo(
      p,
      canvas.height
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      0,
      p
    );

    ctx.lineTo(
      canvas.width,
      p
    );

    ctx.stroke();

  }

}

/* =========================================================
   FOOD
   ========================================================= */

function drawFood() {

  const cx =
    food.x * CELL +
    CELL / 2;

  const cy =
    food.y * CELL +
    CELL / 2;

  const radius =
    Math.max(
      5,
      CELL * 0.27
    );

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#f0d56d";

  ctx.shadowColor =
    "rgba(240,213,109,0.5)";

  ctx.shadowBlur = 12;

  ctx.fill();

  ctx.shadowBlur = 0;

}

/* =========================================================
   SNAKE
   ========================================================= */

function drawSnake() {

  for (
    let i = snake.length - 1;
    i >= 0;
    i--
  ) {

    const part =
      snake[i];

    const x =
      part.x * CELL;

    const y =
      part.y * CELL;

    const padding =
      Math.max(
        2,
        CELL * 0.08
      );

    const size =
      CELL - padding * 2;

    const head =
      i === 0;

    if (head) {

      ctx.fillStyle =
        "#8dffb1";

    } else {

      const shade =
        Math.max(
          80,
          170 - i * 2
        );

      ctx.fillStyle =
        "rgb(" +
        Math.floor(shade * 0.43) +
        "," +
        shade +
        "," +
        Math.floor(shade * 0.60) +
        ")";

    }

    roundedRect(
      ctx,
      x + padding,
      y + padding,
      size,
      size,
      Math.max(
        3,
        CELL * 0.12
      )
    );

    ctx.fill();

    if (head) {

      drawEyes(
        x,
        y
      );

    }

  }

}

/* =========================================================
   EYES
   ========================================================= */

function drawEyes(x, y) {

  const r =
    Math.max(
      2,
      CELL * 0.07
    );

  let x1;
  let y1;
  let x2;
  let y2;

  if (direction.x === 1) {

    x1 =
      x + CELL * 0.68;

    y1 =
      y + CELL * 0.30;

    x2 =
      x + CELL * 0.68;

    y2 =
      y + CELL * 0.70;

  } else if (direction.x === -1) {

    x1 =
      x + CELL * 0.32;

    y1 =
      y + CELL * 0.30;

    x2 =
      x + CELL * 0.32;

    y2 =
      y + CELL * 0.70;

  } else if (direction.y === -1) {

    x1 =
      x + CELL * 0.30;

    y1 =
      y + CELL * 0.32;

    x2 =
      x + CELL * 0.70;

    y2 =
      y + CELL * 0.32;

  } else {

    x1 =
      x + CELL * 0.30;

    y1 =
      y + CELL * 0.68;

    x2 =
      x + CELL * 0.70;

    y2 =
      y + CELL * 0.68;

  }

  ctx.fillStyle =
    "#061008";

  ctx.beginPath();

  ctx.arc(
    x1,
    y1,
    r,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    x2,
    y2,
    r,
    0,
    Math.PI * 2
  );

  ctx.fill();

}

/* =========================================================
   ROUNDED RECT
   ========================================================= */

function roundedRect(
  context,
  x,
  y,
  width,
  height,
  radius
) {

  const r =
    Math.min(
      radius,
      width / 2,
      height / 2
    );

  context.beginPath();

  context.moveTo(
    x + r,
    y
  );

  context.arcTo(
    x + width,
    y,
    x + width,
    y + height,
    r
  );

  context.arcTo(
    x + width,
    y + height,
    x,
    y + height,
    r
  );

  context.arcTo(
    x,
    y + height,
    x,
    y,
    r
  );

  context.arcTo(
    x,
    y,
    x + width,
    y,
    r
  );

  context.closePath();

}

/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    const key =
      event.key.toLowerCase();

    if (
      key === "arrowup" ||
      key === "w"
    ) {

      event.preventDefault();

      setDirection("up");

      return;

    }

    if (
      key === "arrowdown" ||
      key === "s"
    ) {

      event.preventDefault();

      setDirection("down");

      return;

    }

    if (
      key === "arrowleft" ||
      key === "a"
    ) {

      event.preventDefault();

      setDirection("left");

      return;

    }

    if (
      key === "arrowright" ||
      key === "d"
    ) {

      event.preventDefault();

      setDirection("right");

      return;

    }

    /*
     * SPACE = PAUSE / RESUME
     */

    if (event.code === "Space") {

      event.preventDefault();

      if (state === "playing") {

        pauseGame();

      } else if (state === "paused") {

        resumeGame();

      }

      return;

    }

    /*
     * ESC is intentionally NOT used.
     */

  }
);

/* =========================================================
   TOUCH D-PAD
   ========================================================= */

document
  .querySelectorAll("[data-direction]")
  .forEach(
    function(button) {

      button.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          const dir =
            button.getAttribute(
              "data-direction"
            );

          setDirection(dir);

        }
      );

    }
  );

/* =========================================================
   SWIPE START
   ========================================================= */

canvas.addEventListener(
  "touchstart",
  function(event) {

    if (
      !event.touches ||
      event.touches.length === 0
    ) {

      return;

    }

    touchStartX =
      event.touches[0].clientX;

    touchStartY =
      event.touches[0].clientY;

  },
  {
    passive: true
  }
);

/* =========================================================
   SWIPE END
   ========================================================= */

canvas.addEventListener(
  "touchend",
  function(event) {

    if (
      !event.changedTouches ||
      event.changedTouches.length === 0
    ) {

      return;

    }

    const touch =
      event.changedTouches[0];

    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;

    const absX =
      Math.abs(dx);

    const absY =
      Math.abs(dy);

    const minimumSwipe = 25;

    if (
      Math.max(
        absX,
        absY
      ) < minimumSwipe
    ) {

      return;

    }

    if (absX > absY) {

      if (dx > 0) {

        setDirection("right");

      } else {

        setDirection("left");

      }

    } else {

      if (dy > 0) {

        setDirection("down");

      } else {

        setDirection("up");

      }

    }

  },
  {
    passive: true
  }
);

/* =========================================================
   PREVENT BOARD SCROLLING ON TOUCH
   ========================================================= */

canvas.addEventListener(
  "touchmove",
  function(event) {

    event.preventDefault();

  },
  {
    passive: false
  }
);

/* =========================================================
   INITIAL STATE
   ========================================================= */

resetGame();

state = "menu";

hideAllOverlays();

startOverlay.classList.remove(
  "hidden"
);

</script>
